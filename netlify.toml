[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GHL_FUNDING_WEBHOOK_URL,GHL_LOCATION_ID,GHL_PRIVATE_INTEGRATION_TOKEN,GHL_FREESITES_STARTER_TOKEN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

  [[redirects]]
  from = "/donedeal"
  to = "https://api.leadconnectorhq.com/widget/booking/KGg5oY0e1xET5qvRuZdE"
  status = 302
